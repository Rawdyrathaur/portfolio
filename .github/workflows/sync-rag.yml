name: Sync RAG Knowledge Base

on:
  push:
    branches: [main]
    paths:
      # Trigger when you update content files
      - "src/content/**"
      # Trigger when you write a new blog post
      - "src/content/blog/**"
      # Trigger when you manually update knowledge files
      - "backend/knowledge/**"
      # Trigger when the sync script itself changes
      - "scripts/sync_knowledge.py"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-rag:
    name: Sync RAG Knowledge Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run knowledge sync
        env:
          BACKEND_URL: https://msrathaur-manish-portfolio-api.hf.space
          RAG_RELOAD_SECRET: ${{ secrets.RAG_RELOAD_SECRET }}
        run: |
          python scripts/sync_knowledge.py

      - name: Commit updated knowledge files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync RAG knowledge base [skip ci]"
          file_pattern: "backend/knowledge/*.md"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
